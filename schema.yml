components:
  schemas:
    Appointment:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        scheduled_at:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/StatusEnum'
        reason:
          type: string
        observations:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        pet:
          type: integer
        veterinarian:
          type: integer
        service:
          type: integer
      required:
      - created_at
      - id
      - pet
      - reason
      - scheduled_at
      - service
      - updated_at
      - veterinarian
    AppointmentRequest:
      type: object
      properties:
        scheduled_at:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/StatusEnum'
        reason:
          type: string
          minLength: 1
        observations:
          type: string
        pet:
          type: integer
        veterinarian:
          type: integer
        service:
          type: integer
      required:
      - pet
      - reason
      - scheduled_at
      - service
      - veterinarian
    MedicalRecord:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        diagnosis:
          type: string
        treatment:
          type: string
        prescription:
          type: string
        notes:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        appointment:
          type: integer
        veterinarian:
          type: integer
          readOnly: true
      required:
      - appointment
      - created_at
      - diagnosis
      - id
      - treatment
      - updated_at
      - veterinarian
    MedicalRecordRequest:
      type: object
      properties:
        diagnosis:
          type: string
          minLength: 1
        treatment:
          type: string
          minLength: 1
        prescription:
          type: string
        notes:
          type: string
        appointment:
          type: integer
      required:
      - appointment
      - diagnosis
      - treatment
    PatchedAppointmentRequest:
      type: object
      properties:
        scheduled_at:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/StatusEnum'
        reason:
          type: string
          minLength: 1
        observations:
          type: string
        pet:
          type: integer
        veterinarian:
          type: integer
        service:
          type: integer
    PatchedMedicalRecordRequest:
      type: object
      properties:
        diagnosis:
          type: string
          minLength: 1
        treatment:
          type: string
          minLength: 1
        prescription:
          type: string
        notes:
          type: string
        appointment:
          type: integer
    PatchedPetRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        species:
          $ref: '#/components/schemas/SpeciesEnum'
        breed:
          type: string
          maxLength: 100
        birth_date:
          type: string
          format: date
          nullable: true
        weight:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,2})?$
        sex:
          $ref: '#/components/schemas/SexEnum'
        is_active:
          type: boolean
    PatchedUserRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 1
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
        password:
          type: string
          writeOnly: true
          minLength: 8
        phone:
          type: string
          maxLength: 20
        address:
          type: string
          maxLength: 255
        role:
          $ref: '#/components/schemas/RoleEnum'
        is_active:
          type: boolean
          title: Active
          description: Designates whether this user should be treated as active. Unselect
            this instead of deleting accounts.
    PatchedVeterinaryServiceRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
        duration_minutes:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        is_active:
          type: boolean
    Pet:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        species:
          $ref: '#/components/schemas/SpeciesEnum'
        breed:
          type: string
          maxLength: 100
        birth_date:
          type: string
          format: date
          nullable: true
